<div class="w-full max-w-md mx-auto min-h-[90vh] flex items-center justify-center p-4">
    <main class="bg-white rounded-3xl shadow-xl border border-slate-200 w-full max-w-sm min-h-[400px] flex flex-col overflow-hidden">
        
        <div class="p-8 flex-grow flex flex-col">
            <a routerLink="/login" class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-indigo-600 transition-colors mb-6">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                Back to Login
            </a>

            @if (!emailSent()) {
                <div class="flex-grow flex flex-col justify-center animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div class="text-center mb-8">
                        <h1 class="text-2xl font-bold text-slate-900">Forgot Password?</h1>
                        <p class="text-sm text-slate-500 mt-2">Enter your email and we'll send you a reset link.</p>
                    </div>

                    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="space-y-6">
                        <div class="relative">
                            <label class="text-sm font-semibold text-slate-700">Email</label>
                            <input type="email" formControlName="email" placeholder="foulen@recouvra.com"
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
                                [class.!border-red-400]="isInvalid('email')">
                            
                            @if (isInvalid('email')) {
                                <app-error-tooltip [form]="forgotForm" path="email" label="Email"></app-error-tooltip>
                            }
                        </div>

                        <button type="submit" 
                                class="w-full bg-indigo-600 text-white px-8 py-3.5 rounded-xl font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all active:scale-95">
                            Send Reset Link
                        </button>
                    </form>
                </div>
            } @else {
                <div class="flex-grow flex flex-col justify-center items-center text-center animate-in zoom-in duration-500">
                    <div class="w-16 h-16 bg-green-50 text-green-500 rounded-full flex items-center justify-center mb-6">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
                    </div>
                    <h2 class="text-xl font-bold text-slate-900">Check your email</h2>
                    <p class="text-sm text-slate-500 mt-3 px-4">
                        We've sent a password reset link to <br>
                        <span class="font-semibold text-slate-700">{{ forgotForm.value.email }}</span>
                    </p>
                    <button (click)="emailSent.set(false)" class="mt-8 text-sm font-bold text-indigo-600 hover:text-indigo-500">
                        Didn't get the email? Try again
                    </button>
                </div>
            }
        </div>
    </main>
</div>
