<div class="w-full max-w-md mx-auto min-h-[90vh] flex items-center justify-center p-4">
    
    <main class="bg-white rounded-3xl shadow-xl border border-slate-200 w-full max-w-sm flex flex-col mx-auto transition-all duration-300">

        <div class="px-8 pt-8 pb-4 text-center">
            <h1 class="text-2xl font-bold text-slate-900">Create Your Account</h1>
            <p class="text-sm text-slate-500 mt-1">Welcome To Recouvra</p>
        </div>

        <div class="p-8 flex-grow flex flex-col">
            
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex-grow flex flex-col space-y-5">
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2 pb-2">
                        <label class="text-sm font-semibold text-slate-700 block">First Name</label>
                        <div class="relative">
                            <input type="text" formControlName="firstName" placeholder="Foulen"
                               class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
                               [class.!border-red-400]="isInvalid('firstName')">
                        <app-error-tooltip [form]="registerForm" path="firstName"></app-error-tooltip>
                        </div>

                    </div>
                    <div class="space-y-2 pb-2">
                        <label class="text-sm font-semibold text-slate-700 block">Last Name</label>
                        <div class="relative">
                            <input type="text" formControlName="lastName" placeholder="Ben Foulen"
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
                                [class.!border-red-400]="isInvalid('lastName')">
                            <app-error-tooltip [form]="registerForm" path="lastName"></app-error-tooltip>
                            </div>
                        </div>
                </div>

                <div class="space-y-2 pb-2">
                    <label class="text-sm font-semibold text-slate-700 block">Email</label>
                    <div class="relative">
                        <input type="email" formControlName="email" placeholder="foulen@recouvra.com"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
                           [class.!border-red-400]="isInvalid('email')">
                        <app-error-tooltip [form]="registerForm" path="email"></app-error-tooltip>
                    </div>
                </div>

                <div class="space-y-2 pb-2">
                    <label class="text-sm font-semibold text-slate-700 block">Password</label>
                    <div class="relative">
                        <input [type]="showPassword() ? 'text' : 'password'" 
                               formControlName="password" 
                               placeholder="••••••••"
                               class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all pr-12"
                               [class.!border-red-400]="isInvalid('password')">
                            
                            <app-error-tooltip [form]="registerForm" path="password"></app-error-tooltip>
                            
                        
                        <button type="button" (click)="togglePassword()"
                                 class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
                            @if (showPassword()) {
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" /></svg>
                            } @else {
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                            }
                        </button>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit"
                            class="w-full bg-indigo-600 text-white px-8 py-3.5 rounded-xl font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all active:scale-95 disabled:bg-slate-300 disabled:shadow-none">
                        Create Account
                    </button>
                </div>
                
                <p class="text-sm text-center text-slate-500 mt-4">
                    Already have an account? 
                    <a routerLink="/login" class="font-semibold text-indigo-600 hover:text-indigo-500">
                        Sign in
                    </a>
                </p>

            </form>
        </div>
    </main>
</div>
